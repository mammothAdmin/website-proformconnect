<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
  body {
    width: 1200px; height: 630px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .glow1 {
    position: absolute; top: -120px; left: -80px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(14,165,201,0.25) 0%, transparent 70%);
    border-radius: 50%;
  }
  .glow2 {
    position: absolute; bottom: -100px; right: -60px;
    width: 450px; height: 450px;
    background: radial-gradient(circle, rgba(124,58,237,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }
  .content {
    position: relative; z-index: 1;
    text-align: center;
    max-width: 900px;
    padding: 0 60px;
  }
  .logo {
    display: inline-flex; align-items: center; gap: 14px;
    margin-bottom: 36px;
  }
  .logo-icon {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #18b9d9, #8b5cf6);
    border-radius: 14px;
  }
  .logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .logo-name { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  h1 {
    font-size: 56px; font-weight: 800;
    letter-spacing: -0.035em; line-height: 1.1;
    margin-bottom: 20px;
  }
  h1 span {
    background: linear-gradient(90deg, #18b9d9, #8b5cf6, #c026d3);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .tagline {
    font-size: 22px; color: #94a3b8;
    line-height: 1.5; margin-bottom: 36px;
  }
  .pills { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .pill {
    padding: 8px 20px;
    border: 1px solid rgba(14,165,201,0.3);
    border-radius: 100px;
    font-size: 14px; font-weight: 600;
    color: #94a3b8;
    background: rgba(14,165,201,0.08);
  }
</style>
</head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="content">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <div class="logo-name">ProformConnect</div>
    </div>
    <h1>Your clients. Our team.<br><span>Better results.</span></h1>
    <p class="tagline">Outsourced intake, outreach, and document assistance for law firms.</p>
    <div class="pills">
      <div class="pill">Intake</div>
      <div class="pill">Client Outreach</div>
      <div class="pill">Document Assistance</div>
    </div>
  </div>
</body>
</html>
